apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.serialization"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def modelName = "sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8"
def speechBuild = layout.buildDirectory.dir("parakeet").get().asFile
def modelAssets = new File(speechBuild, "assets")
def sherpaAar = new File(speechBuild, "sherpa-onnx-2.0.3.aar")

def downloadSpeechArtifact = { File file, String url, String checksum ->
    file.parentFile.mkdirs()
    def partial = new File(file.path + ".part")
    try {
        def digest = java.security.MessageDigest.getInstance("SHA-256")
        def connection = new URL(url).openConnection()
        connection.connectTimeout = 30000
        connection.readTimeout = 60000
        connection.inputStream.withCloseable { input ->
            partial.withOutputStream { it << new java.security.DigestInputStream(input, digest) }
        }
        if (digest.digest().encodeHex().toString() != checksum) {
            throw new GradleException("Checksum mismatch for ${file.name}")
        }
        java.nio.file.Files.move(partial.toPath(), file.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    } finally {
        partial.delete()
    }
}

def downloadSherpa = tasks.register("downloadSherpa") {
    outputs.file(sherpaAar)
    doLast {
        downloadSpeechArtifact(sherpaAar,
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.3/sherpa-onnx-2.0.3.aar",
            "4c766e2e74c9d33d595338c21fe3b305c73ba45d47e96a235675c33142a2ec50")
    }
}

def modelArchive = new File(speechBuild, "model.tar.bz2")
def downloadParakeet = tasks.register("downloadParakeet") {
    outputs.file(modelArchive)
    doLast {
        downloadSpeechArtifact(modelArchive,
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/${modelName}.tar.bz2",
            "1495e91b59d7fc53ddca91f3431758ec99f8fa253fdb0e1e851be0f72b14b0f9")
    }
}

def prepareParakeet = tasks.register("prepareParakeet", Sync) {
    dependsOn downloadParakeet
    from({ tarTree(resources.bzip2(modelArchive)) }) {
        include "${modelName}/*.onnx", "${modelName}/tokens.txt", "${modelName}/LICENSE*"
    }
    into modelAssets
}

android {
    namespace "io.github.tyanochkuby.androidagent"
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "io.github.tyanochkuby.androidagent"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    androidResources {
        noCompress "onnx"
    }

    sourceSets {
        main.assets.srcDir(modelAssets)
        // Written by scripts/speech-samples.sh for ParakeetSmokeTest.
        androidTest.assets.srcDir(layout.buildDirectory.dir("generated/speech-samples").get().asFile)
    }
}

preBuild.dependsOn prepareParakeet

dependencies {
    implementation(files(sherpaAar).builtBy(downloadSherpa))
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1")
    testImplementation("junit:junit:4.13.2")
    androidTestImplementation("androidx.test:runner:1.6.2")
    androidTestImplementation("junit:junit:4.13.2")
    testImplementation("org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1")
}
